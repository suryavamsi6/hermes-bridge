[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bridge"
version = "0.1.0"
description = "A small, allowlisting management API for a self-hosted Hermes Agent, built for mobile apps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# No runtime dependencies: standard library only, so it runs on any Linux python3 >= 3.11.
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "License :: OSI Approved :: MIT License"]

[project.scripts]
hermes-bridge = "hermes_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
